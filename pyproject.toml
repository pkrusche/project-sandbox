[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-sandbox"
version = "0.4.0"
description = "Sandbox coding agents inside isolated container runtimes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "tomlkit==0.15.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.99",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
project-sandbox = "project_sandbox.cli:main"
project-sandbox-egress = "project_sandbox.egress_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_sandbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/project_sandbox",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.uv]
cache-dir = ".uv_cache"

[tool.ruff.lint.per-file-ignores]
# Registry payload validation reports malformed external data, not bad caller types.
"scripts/update-pins.py" = ["TRY004"]
# Keeping resource-owning contexts nested makes their cleanup boundaries explicit.
"tests/*.py" = ["SIM117"]

[tool.pytest.ini_options]
# Live security audits are explicitly invoked from scripts/security_e2e.
testpaths = ["tests"]
# Also registered by scripts/security_e2e/conftest.py; tests/ imports those modules.
markers = [
    "shared_image: security e2e launches share one image per egress mode",
]
